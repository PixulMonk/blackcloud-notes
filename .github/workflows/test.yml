name: Run Unit Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - run: npm ci
      - run: npm run build
        working-directory: ./shared
      - run: npm test
        working-directory: ./frontend

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - run: npm ci
      - run: npm run build
        working-directory: ./shared
      - run: npm test
        working-directory: ./backend
        env:
          JWT_SECRET: test-secret-for-ci
          SALT_HMAC_SECRET: test-hmac-secret-for-ci
          RESEND_API_KEY: re_test_fake_key_for_ci
